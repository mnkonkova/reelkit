# Чистый монтаж без распознавания речи.
#
# Ничего, кроме ffmpeg, не требуется: субтитров нет, значит нет и виспера.
# Движок слушает исходники только измерителем тишины (чтобы отрезать мёртвый
# воздух), смотрит на лица локальной моделью и режет картинку по ритму.
# Это стиль по умолчанию, когда нужен просто смонтированный материал.
title: "Просто монтаж, без распознавания"

look: {profile: punchy}
pacing: {shot_min_sec: 1.6, shot_target_sec: 2.8, shot_max_sec: 4.2, opening_shot_sec: 1.8}
transition: {kind: dissolve, duration_sec: 0.16}
captions: {enabled: false}
circle: {mode: "off"}
